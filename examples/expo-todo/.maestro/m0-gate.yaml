# M0 gate: an empty Expo app opens an encrypted DB from JS, writes a row and reads it back.
appId: com.nikhilll.syncflow.expotodo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'DB OK: Milk.*'
    timeout: 30000
- assertVisible: 'SQLite3 Multiple Ciphers 2.7.1.*'
- assertNotVisible: 'DB FAILED.*'
