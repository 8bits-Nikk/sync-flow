name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAESTRO_VERSION: 2.12.1

jobs:
  js:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  cpp:
    name: C++ core (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build libc++-dev libc++abi-dev
      - name: Build and test
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            export CC=clang CXX=clang++
            EXTRA="-DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++"
          fi
          cmake -S packages/sync-flow/cpp -B build/cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug $EXTRA
          cmake --build build/cpp
          ctest --test-dir build/cpp --output-on-failure

  android:
    name: Android build + Maestro gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Prebuild
        working-directory: examples/expo-todo
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build release APK (x86_64 for the emulator)
        working-directory: examples/expo-todo/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Build arm64 too (catches ARM-only compile errors)
        working-directory: examples/expo-todo/android
        run: ./gradlew :nikhilll_sync-flow:externalNativeBuildRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: expo-todo-android
          path: examples/expo-todo/android/app/build/outputs/apk/release/app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION=$MAESTRO_VERSION bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run gate on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install examples/expo-todo/android/app/build/outputs/apk/release/app-release.apk
            maestro test examples/expo-todo/.maestro/m0-gate.yaml

  ios:
    name: iOS build + Maestro gate
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select the newest Xcode (Expo SDK 58 needs Xcode 26+)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_2*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - name: Prebuild + pods
        working-directory: examples/expo-todo
        run: npx expo prebuild --platform ios --clean
      - name: Build for the simulator (Release, no Metro needed)
        working-directory: examples/expo-todo/ios
        run: |
          xcodebuild -workspace SyncFlowTodo.xcworkspace -scheme SyncFlowTodo \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= > xcodebuild.log 2>&1 \
            || { grep -n -B2 -A12 'error:' xcodebuild.log | head -150; tail -80 xcodebuild.log; exit 1; }
      - name: Run gate on the simulator
        # Reads the result file the app writes, instead of a UI driver: Maestro's XCTest driver
        # timed out on cold CI simulators. The same Maestro flow runs on a local Mac and on Android.
        env:
          APP: examples/expo-todo/ios/build/Build/Products/Release-iphonesimulator/SyncFlowTodo.app
          BUNDLE: com.nikhilll.syncflow.expotodo
        run: |
          read RUNTIME DEVTYPE < <(xcrun simctl list -j runtimes | python3 -c "
          import json, sys
          rs = [r for r in json.load(sys.stdin)['runtimes'] if r['platform'] == 'iOS' and r['isAvailable']]
          r = max(rs, key=lambda r: [int(x) for x in r['version'].split('.')])
          dt = next(d['identifier'] for d in r['supportedDeviceTypes'] if d['productFamily'] == 'iPhone')
          print(r['identifier'], dt)")
          echo "runtime=$RUNTIME device=$DEVTYPE"
          UDID=$(xcrun simctl create sf-gate "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          check() {  # $1 = expected text; launches the app and waits for its result file
            xcrun simctl launch "$UDID" "$BUNDLE"
            RESULT="$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)/Documents/m0-gate-result.txt"
            for i in $(seq 1 60); do
              if [ -f "$RESULT" ] && grep -q "$1" "$RESULT"; then echo "OK: $(cat "$RESULT")"; return 0; fi
              sleep 2
            done
            echo "::error::expected '$1', got: $(cat "$RESULT" 2>/dev/null || echo '(no result file)')"
            return 1
          }
          check 'DB OK: Milk | launches=1'
          xcrun simctl terminate "$UDID" "$BUNDLE"
          rm -f "$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)/Documents/m0-gate-result.txt"
          check 'DB OK: Milk | launches=2'
